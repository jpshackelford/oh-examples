<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none';"
    />
    <title>Dad Jokes Settings</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        margin: 0;
        padding: 24px;
        color: #e5e7eb;
        background: #0b0f17;
      }
      h1 {
        margin: 0 0 8px 0;
        font-size: 24px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .subtitle {
        color: #9ca3af;
        margin-bottom: 24px;
        font-size: 14px;
      }
      .section {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 20px;
      }
      .section h2 {
        margin: 0 0 16px 0;
        font-size: 16px;
        color: #f3f4f6;
      }
      label {
        display: block;
        margin-bottom: 6px;
        font-size: 14px;
        color: #9ca3af;
      }
      input[type="text"] {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #374151;
        background: #111827;
        color: #e5e7eb;
        font-size: 14px;
        margin-bottom: 16px;
      }
      input[type="text"]:focus {
        outline: none;
        border-color: #6366f1;
        box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
      }
      .checkbox-group {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .checkbox-item {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .checkbox-item input[type="checkbox"] {
        width: 18px;
        height: 18px;
        accent-color: #6366f1;
      }
      .checkbox-item span {
        font-size: 14px;
      }
      .btn-row {
        display: flex;
        gap: 12px;
        margin-top: 20px;
      }
      button {
        padding: 10px 20px;
        border-radius: 8px;
        border: none;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
      }
      .btn-primary {
        background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
        color: white;
      }
      .btn-primary:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
      }
      .btn-danger {
        background: rgba(239, 68, 68, 0.1);
        color: #ef4444;
        border: 1px solid rgba(239, 68, 68, 0.3);
      }
      .btn-danger:hover {
        background: rgba(239, 68, 68, 0.2);
      }
      #status {
        margin-top: 16px;
        padding: 12px;
        border-radius: 8px;
        font-size: 13px;
        display: none;
      }
      #status.success {
        display: block;
        background: rgba(16, 185, 129, 0.1);
        color: #10b981;
        border: 1px solid rgba(16, 185, 129, 0.2);
      }
      #status.error {
        display: block;
        background: rgba(239, 68, 68, 0.1);
        color: #ef4444;
        border: 1px solid rgba(239, 68, 68, 0.2);
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin-top: 16px;
      }
      .stat-card {
        background: rgba(255, 255, 255, 0.03);
        border-radius: 8px;
        padding: 16px;
        text-align: center;
      }
      .stat-value {
        font-size: 28px;
        font-weight: bold;
        color: #f59e0b;
      }
      .stat-label {
        font-size: 12px;
        color: #6b7280;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <h1>👴 Dad Jokes Settings</h1>
    <p class="subtitle">Configure your premium dad humor experience</p>

    <div class="section">
      <h2>🎭 Personalization</h2>
      <label for="dadName">Your Dad Name</label>
      <input type="text" id="dadName" placeholder="e.g., Papa, Pop, Old Man, Father Unit" />
      
      <label for="victimName">Victim's Name (optional)</label>
      <input type="text" id="victimName" placeholder="e.g., Sport, Champ, Kiddo" />
    </div>

    <div class="section">
      <h2>🎯 Joke Categories</h2>
      <div class="checkbox-group">
        <label class="checkbox-item">
          <input type="checkbox" id="catProgramming" checked />
          <span>💻 Programming Jokes</span>
        </label>
        <label class="checkbox-item">
          <input type="checkbox" id="catAI" checked />
          <span>🤖 AI & Tech Jokes</span>
        </label>
        <label class="checkbox-item">
          <input type="checkbox" id="catClassic" checked />
          <span>👴 Classic Dad Jokes</span>
        </label>
        <label class="checkbox-item">
          <input type="checkbox" id="catPuns" checked />
          <span>🎭 Puns (the good kind... they're all good)</span>
        </label>
      </div>
    </div>

    <div class="section">
      <h2>📊 Your Dad Stats</h2>
      <div class="stats">
        <div class="stat-card">
          <div class="stat-value" id="totalGroans">0</div>
          <div class="stat-label">Total Groans</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="dadLevel">1</div>
          <div class="stat-label">Dad Level</div>
        </div>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn-primary" id="save">💾 Save Settings</button>
      <button class="btn-danger" id="reset">🗑️ Reset Stats</button>
    </div>

    <div id="status"></div>

    <script>
      (function () {
        var parentWindow = window.parent;
        var nextId = 1;
        var pending = {};

        window.addEventListener("message", function (event) {
          if (event.source !== parentWindow) return;
          var msg = event.data;
          if (!msg || msg.kind !== "response") return;
          var entry = pending[msg.id];
          if (!entry) return;
          delete pending[msg.id];
          if (msg.error !== undefined) entry.reject(new Error(msg.error));
          else entry.resolve(msg.result);
        });

        function request(method, params) {
          var id = nextId++;
          return new Promise(function (resolve, reject) {
            pending[id] = { resolve: resolve, reject: reject };
            parentWindow.postMessage(
              { kind: "request", id: id, method: method, params: params },
              "*"
            );
          });
        }

        var api = {
          storage: {
            get: function (key) {
              return request("storage.get", { key: key });
            },
            set: function (key, value) {
              return request("storage.set", { key: key, value: value });
            },
          },
          window: {
            showInformationMessage: function (message) {
              return request("window.showInformationMessage", { message: message });
            },
          },
        };

        var statusEl = document.getElementById("status");

        function showStatus(message, type) {
          statusEl.textContent = message;
          statusEl.className = type;
          setTimeout(function () {
            statusEl.className = "";
          }, 3000);
        }

        function calculateDadLevel(groans) {
          if (groans >= 100) return "👑 Supreme Dad";
          if (groans >= 50) return "🏆 Master Dad";
          if (groans >= 25) return "⭐ Expert Dad";
          if (groans >= 10) return "📈 Rising Dad";
          if (groans >= 5) return "🌱 Apprentice Dad";
          return "🥚 Novice Dad";
        }

        // Load saved settings
        Promise.all([
          api.storage.get("dadName"),
          api.storage.get("victimName"),
          api.storage.get("categories"),
          api.storage.get("groanCount"),
        ]).then(function (results) {
          var dadName = results[0];
          var victimName = results[1];
          var categories = results[2];
          var groanCount = results[3] || 0;

          if (dadName) document.getElementById("dadName").value = dadName;
          if (victimName) document.getElementById("victimName").value = victimName;
          
          if (categories) {
            document.getElementById("catProgramming").checked = categories.programming !== false;
            document.getElementById("catAI").checked = categories.ai !== false;
            document.getElementById("catClassic").checked = categories.classic !== false;
            document.getElementById("catPuns").checked = categories.puns !== false;
          }

          document.getElementById("totalGroans").textContent = groanCount;
          document.getElementById("dadLevel").textContent = calculateDadLevel(groanCount);
        });

        // Save settings
        document.getElementById("save").addEventListener("click", function () {
          var settings = {
            dadName: document.getElementById("dadName").value,
            victimName: document.getElementById("victimName").value,
            categories: {
              programming: document.getElementById("catProgramming").checked,
              ai: document.getElementById("catAI").checked,
              classic: document.getElementById("catClassic").checked,
              puns: document.getElementById("catPuns").checked,
            },
          };

          Promise.all([
            api.storage.set("dadName", settings.dadName),
            api.storage.set("victimName", settings.victimName),
            api.storage.set("categories", settings.categories),
          ]).then(function () {
            showStatus("✅ Settings saved! Your dad powers are configured.", "success");
            api.window.showInformationMessage("👴 Settings saved! Now go forth and make them groan.");
          }).catch(function (e) {
            showStatus("❌ Error saving: " + e.message, "error");
          });
        });

        // Reset stats
        document.getElementById("reset").addEventListener("click", function () {
          if (!confirm("Are you sure? This will reset your groan count and dad level!")) {
            return;
          }
          
          api.storage.set("groanCount", 0).then(function () {
            document.getElementById("totalGroans").textContent = "0";
            document.getElementById("dadLevel").textContent = calculateDadLevel(0);
            showStatus("🗑️ Stats reset. Time to rebuild your dad legacy!", "success");
          });
        });
      })();
    </script>
  </body>
</html>
